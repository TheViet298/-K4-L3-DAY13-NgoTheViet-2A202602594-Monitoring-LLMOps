alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-02594
    runbook: docs/alerts.md#alert-1
  - name: ElevatedRequestErrorRate
    severity: critical
    condition: 'error_rate_pct > 2'
    duration: 5m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-02594
    runbook: docs/alerts.md#alert-2
  - name: LowRetrievalSuccess
    severity: warning
    condition: 'retrieval_success_rate_pct < 90'
    duration: 5m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-02594
    runbook: docs/alerts.md#alert-3
